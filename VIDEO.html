    <style>
      
.pm-video-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;        
    margin: 0 auto;          
    border-radius: 16px;    
    overflow: hidden;
    border: 3px solid #909090; 
    box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    background: #101010;
}

.pm-video-wrapper video {
    width: 100%;
    height: auto;
    display: block;
}

.pm-video-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, 
        rgba(200, 200, 210, 0.85) 0%, 
        rgba(180, 180, 190, 0.95) 100%);
    backdrop-filter: blur(8px);
    padding: 10px 16px;
    display: flex;
    flex-direction: column; 
    gap: 8px;
    opacity: 0;
    transition: opacity 0.3s ease;
    border-top: 1px solid rgba(255, 255, 255, 0.4);
}

.pm-video-wrapper:hover .pm-video-controls,
.pm-video-wrapper.paused .pm-video-controls {
    opacity: 1;
}

.pm-row-bottom {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
}

.pm-spacer {
    flex: 1;
}

.pm-ctrl-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(180deg, #d6d6da 0%, #9c9ca2 100%);
    border: 2px solid #75757b;
    color: #1a1a1d;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    box-shadow: 
        0 3px 0 #6a6a70,
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    flex-shrink: 0;
}

.pm-ctrl-btn:hover {
    background: linear-gradient(180deg, #e8e8ec 0%, #aeb0b6 100%);
    transform: translateY(-2px);
    box-shadow: 
        0 5px 0 #6a6a70,
        0 0 15px rgba(200, 200, 210, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.pm-ctrl-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #6a6a70;
}

.pm-ctrl-btn.play-pause {
    width: 42px;
    height: 42px;
    font-size: 16px;
}

.pm-progress-container {
    width: 100%;
    height: 6px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
}

.pm-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e7c7d5, #e9dfc3, #c1e6e1, #c7dce4, #baa7d1);
     background-size: 200% 100%;
    animation: pmHoloMove 3s linear infinite;
    border-radius: 3px;
    position: relative;
    box-shadow: 0 0 8px rgba(150, 100, 255, 0.4);
}

.pm-progress-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #9b5de5;
    box-shadow: 0 0 6px rgba(150, 100, 255, 0.5);
    opacity: 0;
    transition: opacity 0.2s;
}

.pm-progress-container:hover .pm-progress-fill::after {
    opacity: 1;
}

@keyframes pmHoloMove {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

.pm-time {
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: #2a2a3e;
    font-weight: 700;
    min-width: 85px;
    text-align: center;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
}

.pm-big-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(180deg, #d6d6da 0%, #9c9ca2 100%);
    border: 3px solid #75757b;
    color: #1a1a1d;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
        0 6px 0 #6a6a70,
        0 10px 30px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: auto;
}

.pm-video-wrapper.paused .pm-big-play {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.pm-big-play:hover {
    transform: translate(-50%, -50%) scale(1.05);
    background: linear-gradient(180deg, #e8e8ec 0%, #aeb0b6 100%);
}


.video-info-block {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px;
    text-align: center;
    color: #fff;
    box-sizing: border-box;
}

.video-info-block h2 {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    margin-bottom: 10px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.video-info-block p {
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    opacity: 0.8;
    margin-bottom: 20px;
}

.nav-link2 {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 14px 28px;
    text-decoration: none;
    color: #131313;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    transition: all 0.3s ease;
    background: linear-gradient(180deg, #b0b0b0 0%, #909090 100%);
    border: 2px solid #707070;
    box-shadow: 
        0 3px 0 #606060,
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    text-align: center;
    margin: 0 auto 30px;
}

.nav-link2:hover {
    background: linear-gradient(180deg, #c0c0c0 0%, #a0a0a0 100%);
    color: #141414;
    transform: translateY(-2px);
    box-shadow: 
        0 5px 0 #606060,
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        0 0 15px rgba(200, 200, 200, 0.4);
}

.nav-link2:active {
    transform: translateY(1px);
    box-shadow: 0 2px 0 #606060;
}

@media (max-width: 768px) {
    .video-page-main {
        margin-left: 0 !important;
        padding: 10px !important;
    }

    .pm-video-wrapper {
        max-width: 100%;
        border-radius: 12px;
    }

     .video-info-block {
        max-width: 100%;
        padding: 16px;
    }

    .nav-link2 {
        width: 90%;
        max-width: 400px;
    }

    .pm-ctrl-btn {
        width: 42px;
        height: 42px;
        font-size: 15px;
    }

    .pm-ctrl-btn.play-pause {
        width: 48px;
        height: 48px;
        font-size: 18px;
    }

    .pm-time {
        font-size: 11px;
        min-width: 75px;
    }

    .pm-big-play {
        width: 64px;
        height: 64px;
        font-size: 26px;
    }
}

@media (max-width: 400px) {
    .pm-ctrl-btn {
        width: 38px;
        height: 38px;
        font-size: 13px;
    }

    .pm-ctrl-btn.play-pause {
        width: 44px;
        height: 44px;
        font-size: 16px;
    }

    .pm-time {
        font-size: 10px;
        min-width: 65px;
    }
}
    </style>

        <div class="pm-video-wrapper paused" id="videoWrapper">
            <video id="mainVideo" preload="metadata" playsinline>
                <source id="videoSource" src="" type="video/mp4">
                Ваш браузер не поддерживает встроенные видео.
            </video>
        
            <button class="pm-big-play" id="bigPlayBtn">▶</button>

            <div class="pm-video-controls">
            
                <div class="pm-row-top">
                    <div class="pm-progress-container" id="progressContainer">
                        <div class="pm-progress-fill" id="progressFill"></div>
                    </div>
                </div>
             
                <div class="pm-row-bottom">
                    <button class="pm-ctrl-btn play-pause" id="playPauseBtn">▶</button>
                    <span class="pm-time" id="timeDisplay">0:00 / 0:00</span>
                    <div class="pm-spacer"></div>
                    <button class="pm-ctrl-btn" id="volumeBtn">🔊</button>
                    <button class="pm-ctrl-btn" id="fullscreenBtn">⛶</button>
                </div>
            </div>
        </div>
        
       
        <div class="video-info-block">
            <h2 id="videoTitle">Загрузка...</h2>
            <p id="videoDesc">Пожалуйста, подождите</p>
        </div>

            <span>← Назад к плейлистам</span>

        </a>

<script>

    document.addEventListener('DOMContentLoaded', function() {
        const video = document.getElementById('mainVideo');
        const wrapper = document.getElementById('videoWrapper');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const bigPlayBtn = document.getElementById('bigPlayBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeBtn = document.getElementById('volumeBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
                playPauseBtn.textContent = '⏸';
                wrapper.classList.remove('paused');
            } else {
                video.pause();
                playPauseBtn.textContent = '▶';
                wrapper.classList.add('paused');
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);
        bigPlayBtn.addEventListener('click', togglePlay);
        

        video.addEventListener('click', togglePlay);

        video.addEventListener('timeupdate', () => {
            const percent = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        });


        let isMuted = false;
        volumeBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            video.muted = isMuted;
            volumeBtn.textContent = isMuted ? '🔇' : '🔊';
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => {
                    console.log(`Ошибка полноэкранного режима: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });


        video.addEventListener('ended', () => {
            playPauseBtn.textContent = '▶';
            wrapper.classList.add('paused');
            progressFill.style.width = '100%';
        });


        // =====  СУЩЕСТВУЮЩАЯ ЛОГИКА ЗАГРУЗКИ ВИДЕО =====
        const videosDB = {
            '1': {
                src: 'playlist_popular/☆・ fairy grunge playlist ・☆.mp4',
                poster: '',
                title: '☆・ fairy grunge playlist ・☆',
                desc: 'Атмосферный микс для уютных вечеров'
            },
            '2': {
                src: 'playlist_popular/a playlist for fawns and deers..mp4',
                poster: '',
                title: 'a playlist for fawns and deers.',
                desc: 'Нежная и спокойная музыка'
            },
            '3': {
                src: 'playlist_popular/41 minutes of Roblox music.mp4',
                poster: '',
                title: '41 minutes of Roblox music',
                desc: 'Ностальгический саундтрек'
            },
            '4': {
                src: 'playlist_popular/плейлист чтобы чувствовать себя яблочным соком.mp4',
                poster: '',
                title: 'плейлист чтобы чувствовать себя яблочным соком',
                desc: 'Свежий и легкий вайб'
            },
            '5': {
                src: 'playlist_popular/starry breakcore mix.mp4',
                poster: '',
                title: 'starry breakcore mix',
                desc: 'Энергичный брейккор микс'
            },
            '6': {
                src: 'playlist_vsyakoe/Playlist nostalgic [get-save.com].mp4',
                poster: '',
                title: 'Playlist nostalgic',
                desc: 'Ностальгия'
            },
             '7': {
                src: 'playlist_vsyakoe/006 [get-save.com].mp4',
                poster: '',
                title: 'Dream playlist',
                desc: ''
            },
             '8': {
                src: 'playlist_vsyakoe/softcore calmingcomfortchill playlist [get-save.com].mp4',
                poster: '',
                title: 'calming comfort chill playlist',
                desc: ''
            },
             '9': {
                src: 'playlist_vsyakoe/laufey playlist [get-save.com].mp4',
                poster: '',
                title: 'laufey / romantic playlist',
                desc: ''
            },
             '10': {
                src: 'playlist_vsyakoe/peace [get-save.com].mp4',
                poster: '',
                title: 'peace ',
                desc: ''
            },
             
            
            'default': {
                src: 'videos/default.mp4',
                poster: 'poster.jpg',
                title: 'Добро пожаловать в PlayMuz',
                desc: 'Выберите видео из раздела "Популярное", чтобы начать просмотр.'
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const currentVideo = videosDB[videoId] || videosDB['default'];

        const sourceElement = document.getElementById('videoSource');
        const titleElement = document.getElementById('videoTitle');
        const descElement = document.getElementById('videoDesc');

        if (video && sourceElement) {
            sourceElement.src = currentVideo.src;
            video.poster = currentVideo.poster;
            
            if (titleElement) titleElement.textContent = currentVideo.title;
            if (descElement) descElement.textContent = currentVideo.desc;

            video.load();
        }
    });

    // ===== ЛОГИКА МОБИЛЬНОГО МЕНЮ =====
    function toggleMenu() {
        document.getElementById('navig').classList.toggle('open');
    }
</script>
