<style>
 body {
    font-family: 'Montserrat', sans-serif;
    background-color: #e8e8e8;
    margin: 0;
    padding: 0;
}

.main-content {
    margin-left: 250px;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
}

.player-wrapper {
    display: flex;
    gap: 40px;
    background: #2a2a2a;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    padding: 40px;
    max-width: 900px;
    width: 100%;
    flex-wrap: wrap;
}

.player-card {
    flex: 1;
    min-width: 300px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.cover-art {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    position: relative;
    margin-bottom: 25px;
    border: 6px solid #666666;
    box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.3), 
        inset 0 0 0 2px #888888;
    transition: box-shadow 0.3s ease;
}

.cover-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.cover-art::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 45px;
    height: 45px;
    background-color: #2a2a2a;
    border-radius: 50%;
    border: 2px solid #aaaaaa;
    z-index: 2;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

.cover-art.playing {
    animation: spin 8s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.track-info h3 {
    margin: 0 0 8px 0;
    font-size: 22px;
    font-weight: 700;
    color: #e0e0e0;
}

.track-info p {
    margin: 0 0 25px 0;
    font-size: 15px;
    color: #999999;
    font-weight: 500;
}

.progress-container {
    width: 100%;
    height: 6px;
    background: #1a1a1a;
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 10px;
    position: relative;
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #888888 0%, #cccccc 100%);
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s linear;
}

.time-display {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 12px;
    color: #aaaaaa;
    margin-bottom: 25px;
    font-weight: 600;
}

.controls {
    display: flex;
    align-items: center;
    gap: 20px;
}

.ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #aaaaaa;
    font-size: 24px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 50px;
    border-radius: 50%;
}

.ctrl-btn:hover {
    background-color: #444444;
    color: #e0e0e0;
}

.play-btn {
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, #b0b0b0 0%, #666666 100%);
    color: white;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.play-btn:hover {
    background: linear-gradient(135deg, #999999 0%, #888888 100%);
    color: white;
    transform: scale(1.05);
}

.playlist-container {
    flex: 1;
    min-width: 300px;
    border-left: 1px solid #555555;
    padding-left: 30px;
    display: flex;
    flex-direction: column;
}

.playlist-container h4 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: 700;
    color: #e0e0e0;
}

#playlist-ul {
    list-style: none;
    padding: 0;
    margin: 0;
    overflow-y: auto;
    max-height: 400px;
}

#playlist-ul::-webkit-scrollbar {
    width: 6px;
}
#playlist-ul::-webkit-scrollbar-thumb {
    background-color: #555555;
    border-radius: 3px;
}

.playlist-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
    margin-bottom: 8px;
}

.playlist-item:hover {
    background-color: #3a3a3a;
}

.playlist-item.active {
    background-color: #3a3a3a;
    border: 1px solid #1a1a1a;
}

.playlist-item.active .pl-title {
    color: #cccccc;
    font-weight: 700;
}

.pl-number {
    font-size: 14px;
    color: #888888;
    width: 25px;
    font-weight: 600;
}

.playlist-item.active .pl-number {
    color: #333333;
}

.pl-info {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.pl-title {
    font-size: 14px;
    font-weight: 600;
    color: #aaaaaa;
    margin-bottom: 4px;
}

.pl-artist {
    font-size: 12px;
    color: #999999;
}
@media (max-width: 768px) {
    #navig {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
    }
    #navig.open {
        transform: translateX(0);
        box-shadow: 4px 0 30px rgba(0,0,0,0.4);
    }
}

@media (max-width: 768px) {
    .main-content {
        margin-left: 0 !important;
        padding: 16px !important;
    }

    .player-wrapper {
        flex-direction: column !important;
        gap: 20px !important;
        padding: 18px !important;
        max-width: 100% !important;
        width: 100% !important;
        border-radius: 20px !important;
    }

    .player-card {
        min-width: 0 !important;
        width: 100% !important;
    }

    .cover-art {
        width: min(260px, 70vw) !important;
        height: min(260px, 70vw) !important;
        margin-bottom: 18px !important;
        border-width: 5px !important;
    }

    .cover-art::after {
        width: 17% !important;
        height: 17% !important;
        border-width: 2px !important;
    }

    .track-info h3 {
        font-size: 18px !important;
    }

    .track-info p {
        font-size: 13px !important;
        margin-bottom: 18px !important;
    }

    .time-display {
        margin-bottom: 18px !important;
    }

    .controls {
        gap: 12px !important;
    }

    .ctrl-btn {
        width: 44px !important;
        height: 44px !important;
        font-size: 20px !important;
    }

    .play-btn {
        width: 58px !important;
        height: 58px !important;
        font-size: 24px !important;
    }

    .playlist-container {
        min-width: 0 !important;
        width: 100% !important;
        border-left: none !important;
        border-top: 1px solid #555555 !important;
        padding-left: 0 !important;
        padding-top: 18px !important;
    }

    #playlist-ul {
        max-height: 320px !important;
    }

    .playlist-item {

    }


    .nav-link2 {
        width: 100% !important;

        font-size: 15px !important;
        margin-top: 10px;
    }
}

@media (max-width: 420px) {
    .player-wrapper {
        padding: 14px !important;

    .track-info h3 {

    .ctrl-btn {

    .play-btn {

}

.back-buttons {

@media (max-width: 480px) {

</style>

const genreNames = {
    metal: " Metal Playlist",
    rock: " Rock Playlist",
    pop: "Pop Playlist",
    soundtracks: " Soundtracks Playlist",
    alternative: " Alternative Playlist",
    electronic: " Electronic Playlist",
    lofi: " Lo-fi Playlist",
    indie: "Indie Playlist",
    classical: " Classical Playlist",
    all: " Все треки",
    Undertale: "Undertale Ost",
};

let currentPlaylist = [];
let currentIndex = 0;
let isPlaying = false;

const audio = document.getElementById('audio');
const coverImg = document.getElementById('coverImg');
const coverArt = document.getElementById('coverArt');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const playlistUl = document.getElementById('playlist-ul');
const playlistTitle = document.getElementById('playlistTitle');
const progressBar = document.getElementById('progressBar');
const progressCont = document.getElementById('progressContainer');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function initPlayer() {
    const hash = window.location.hash.replace('#', '') || 'all';

    if (hash === 'random') {
        currentPlaylist = [...allTracks]; 
        currentIndex = Math.floor(Math.random() * currentPlaylist.length);
        
        playlistTitle.textContent = "🎲 Случайный трек";
        renderPlaylist();
        loadTrack(currentIndex, true); 
        return; 
    }
    currentPlaylist = hash === 'all' ? [...allTracks] : allTracks.filter(t => t.genre === hash);
    currentIndex = 0;
    
    playlistTitle.textContent = genreNames[hash] || "Плейлист";
    renderPlaylist();
    
    if (currentPlaylist.length > 0) {
        loadTrack(0, false); 
    } else {
        trackTitle.textContent = "Треки не найдены";
        trackArtist.textContent = "—";
    }
}
function renderPlaylist() {
    playlistUl.innerHTML = '';
    currentPlaylist.forEach((track, i) => {
        const li = document.createElement('li');
        li.className = 'playlist-item' + (i === currentIndex ? ' active' : '');
        li.style.cssText = "display: flex; align-items: center; padding: 12px 15px; border-radius: 12px; cursor: pointer; transition: background 0.2s ease; margin-bottom: 8px; background: " + (i === currentIndex ? "#3a3a3a" : "transparent") + ";";
        li.innerHTML = `
            <span style="font-size: 14px; color: #888; width: 25px; font-weight: 600;">${i + 1}</span>
            <div style="flex: 1; display: flex; flex-direction: column;">
                <span style="font-size: 14px; font-weight: 600; color: ${i === currentIndex ? '#ccc' : '#aaa'}; margin-bottom: 4px;">${track.title}</span>
                <span style="font-size: 12px; color: #999;">${track.artist}</span>
            </div>
        `;
        li.addEventListener('click', () => {
            currentIndex = i;
            loadTrack(i, true);
        });
        playlistUl.appendChild(li);
    });
}

function loadTrack(index, autoplay) {
    if (index < 0 || index >= currentPlaylist.length) return;
    const track = currentPlaylist[index];
    
    audio.src = track.src;
    coverImg.src = track.cover;
    trackTitle.textContent = track.title;
    trackArtist.textContent = track.artist;
    
    renderPlaylist();
    
    if (autoplay) {
        audio.play().then(() => {
            isPlaying = true;
            playBtn.textContent = '⏸';
            coverArt.style.animation = "spin 8s linear infinite";
        }).catch(e => console.log("Autoplay blocked:", e));
    } else {
        isPlaying = false;
        playBtn.textContent = '▶';
        coverArt.style.animation = "none";
    }
}

playBtn.addEventListener('click', () => {
    if (currentPlaylist.length === 0) return;
    if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
        coverArt.style.animation = "none";
    } else {
        audio.play();
        playBtn.textContent = '⏸';
        coverArt.style.animation = "spin 8s linear infinite";
    }
    isPlaying = !isPlaying;
});

prevBtn.addEventListener('click', () => {
    if (currentPlaylist.length === 0) return;
    currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
    loadTrack(currentIndex, true);
});

nextBtn.addEventListener('click', () => {
    if (currentPlaylist.length === 0) return;
    currentIndex = (currentIndex + 1) % currentPlaylist.length;
    loadTrack(currentIndex, true);
});

audio.addEventListener('ended', () => {
    currentIndex = (currentIndex + 1) % currentPlaylist.length;
    loadTrack(currentIndex, true);
});

audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
    }
});

progressCont.addEventListener('click', (e) => {
    const rect = progressCont.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
});

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

const style = document.createElement('style');
style.innerHTML = `@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`;
document.head.appendChild(style);

window.addEventListener('hashchange', initPlayer);

initPlayer();
function toggleMenu() {
    document.getElementById('navig').classList.toggle('open');
}
</script>
